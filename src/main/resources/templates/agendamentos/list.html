<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Agendamentos</title>
</head>
<body>
<main class="container my-4">
    <h2 class="mb-4">Agendamentos</h2>
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
    <div th:if="${#lists.isEmpty(agendamentos)}" class="alert alert-info">
        Nenhum agendamento encontrado.
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(agendamentos)}">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Data e horário</th>
                <th>Médico</th>
                <th>Paciente</th>
                <th>Valor da consulta</th>
                <th>Situação</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="agendamento : ${agendamentos}">
                <td th:text="${#temporals.format(agendamento.agenda.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${agendamento.agenda.medico.nome}"></td>
                <td th:text="${agendamento.paciente.nome}"></td>
                <td>
                    <span th:if="${agendamento.valor != null}"
                          th:text="${'R$ ' + #numbers.formatDecimal(agendamento.valor, 1, 2)}"></span>
                    <span th:if="${agendamento.valor == null}" class="text-muted">Não informado</span>
                    <form th:if="${agendamento.status.name() == 'AGENDADO'}"
                          sec:authorize="hasAnyRole('ADMIN','SECRETARIA','MEDICO')"
                          th:action="@{/agendamentos/valor/{id}(id=${agendamento.id})}" method="post"
                          class="d-flex flex-wrap gap-2 mt-2">
                        <input type="number" name="valor" class="form-control form-control-sm"
                               min="0" step="0.01" required placeholder="Valor (R$)"
                               th:value="${agendamento.valor}">
                        <button type="submit" class="btn btn-sm btn-outline-primary">Salvar valor</button>
                    </form>
                </td>
                <td>
                    <span class="badge"
                          th:classappend="${agendamento.status.name() == 'AGENDADO'} ? ' text-bg-primary' : (${agendamento.status.name() == 'REALIZADO'} ? ' text-bg-success' : ' text-bg-secondary')"
                          th:text="${agendamento.status}"></span>
                </td>
                <td class="d-flex flex-wrap gap-2">
                    <form th:if="${administrativo and agendamento.status.name() == 'AGENDADO'}"
                          th:action="@{/agendamentos/confirmar/{id}(id=${agendamento.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-success">Confirmar presença</button>
                    </form>
                    <form th:if="${agendamento.status.name() == 'AGENDADO'}"
                          sec:authorize="hasAnyRole('ADMIN','SECRETARIA','PACIENTE','MEDICO')"
                          th:action="@{/agendamentos/cancelar/{id}(id=${agendamento.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Cancelar</button>
                    </form>
                    <span th:if="${agendamento.status.name() != 'AGENDADO'}" class="text-muted">—</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
