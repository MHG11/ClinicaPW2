<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Agendamentos</title>
</head>
<body>
<main class="container my-4">
    <h2 class="mb-4">Agendamentos</h2>

    <div th:if="${mensagem}" class="alert alert-success" role="alert" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
    <div th:if="${#lists.isEmpty(agendamentos)}" class="alert alert-info">Nenhum agendamento realizado.</div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(agendamentos)}">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Paciente</th>
                <th>Médico</th>
                <th>Data</th>
                <th>Horário</th>
                <th>Situação</th>
                <th class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="agendamento : ${agendamentos}">
                <td th:text="${agendamento.paciente.nome}"></td>
                <td th:text="${agendamento.agenda.medico.nome}"></td>
                <td th:text="${#temporals.format(agendamento.agenda.data, 'dd/MM/yyyy')}"></td>
                <td th:text="${#temporals.format(agendamento.agenda.horario, 'HH:mm')}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${agendamento.status.name() == 'AGENDADO'} ? ' text-bg-primary' : (${agendamento.status.name() == 'REALIZADO'} ? ' text-bg-success' : ' text-bg-secondary')"
                          th:text="${agendamento.status.name() == 'AGENDADO'} ? 'Aguardando comparecimento' : (${agendamento.status.name() == 'REALIZADO'} ? 'Realizado' : 'Cancelado')"></span>
                </td>
                <td class="text-end text-nowrap">
                    <div th:if="${agendamento.status.name() == 'AGENDADO'}" class="d-inline-flex gap-1">
                        <form th:action="@{/agendamentos/{id}/confirmar(id=${agendamento.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-success">Confirmar presença</button>
                        </form>
                        <form th:action="@{/agendamentos/{id}/cancelar(id=${agendamento.id})}" method="post"
                              onsubmit="return confirm('Deseja cancelar este agendamento?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Cancelar</button>
                        </form>
                    </div>
                    <span th:unless="${agendamento.status.name() == 'AGENDADO'}" class="text-muted">—</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
