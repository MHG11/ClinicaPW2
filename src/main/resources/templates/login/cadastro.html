<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 560px;">
        <h4 class="mb-3 text-center">Criar conta</h4>
        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

        <form th:action="@{/usuario/cadastro}" method="post">
            <div class="mb-3">
                <label for="tipoCadastro" class="form-label">Tipo de cadastro</label>
                <select id="tipoCadastro" name="tipoCadastro" class="form-select" required>
                    <option value="PACIENTE" th:selected="${tipoCadastro == null or tipoCadastro == 'PACIENTE'}">Paciente</option>
                    <option value="MEDICO" th:selected="${tipoCadastro == 'MEDICO'}">Sou médico</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="nome" class="form-label">Nome completo</label>
                <input type="text" id="nome" name="nome" class="form-control" maxlength="255"
                       th:value="${nome}" required>
            </div>
            <div class="mb-3">
                <label for="cpf" class="form-label">CPF</label>
                <input type="text" id="cpf" name="cpf" class="form-control" maxlength="255"
                       th:value="${cpf}" required>
            </div>

            <div id="camposPaciente">
                <div class="mb-3">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input type="text" id="telefone" name="telefone" class="form-control" maxlength="255"
                           th:value="${telefone}">
                </div>
            </div>

            <div id="camposMedico" class="d-none">
                <div class="mb-3">
                    <label for="crm" class="form-label">CRM</label>
                    <input type="text" id="crm" name="crm" class="form-control" maxlength="255"
                           th:value="${crm}">
                </div>
                <div class="mb-3">
                    <label for="especialidade" class="form-label">Especialidade</label>
                    <input type="text" id="especialidade" name="especialidade" class="form-control" maxlength="255"
                           th:value="${especialidade}">
                </div>
                <div class="alert alert-info">
                    O cadastro médico ficará pendente até a aprovação da administração.
                </div>
            </div>

            <hr>
            <div class="mb-3">
                <label for="login" class="form-label">Usuário</label>
                <input type="text" id="login" name="login" class="form-control" maxlength="50"
                       th:value="${login}" required>
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" id="senha" name="senha" class="form-control"
                       minlength="6" maxlength="72" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Enviar cadastro</button>
        </form>

        <a th:href="@{/login}" class="btn btn-link btn-sm mt-2">Já tenho conta</a>
    </div>
</div>
<script>
    const tipoCadastro = document.getElementById('tipoCadastro');
    const camposPaciente = document.getElementById('camposPaciente');
    const camposMedico = document.getElementById('camposMedico');
    const telefone = document.getElementById('telefone');
    const crm = document.getElementById('crm');
    const especialidade = document.getElementById('especialidade');

    function atualizarCamposCadastro() {
        const cadastroMedico = tipoCadastro.value === 'MEDICO';
        camposMedico.classList.toggle('d-none', !cadastroMedico);
        camposPaciente.classList.toggle('d-none', cadastroMedico);
        telefone.required = !cadastroMedico;
        crm.required = cadastroMedico;
        especialidade.required = cadastroMedico;
    }

    tipoCadastro.addEventListener('change', atualizarCamposCadastro);
    atualizarCamposCadastro();
</script>
</body>
</html>
