<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Consultas</title>
</head>
<body>
<main class="container my-4">

    <h2 class="mb-4">Consultas realizadas</h2>
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Data</th>
                <th>Valor</th>
                <th>Observação</th>
                <th>Paciente</th>
                <th>Médico</th>
                <th th:if="${medicoLogado}">Editar observação</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${consulta}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.data}"></td>
                <td th:text="${c.valor}"></td>
                <td th:text="${#strings.isEmpty(c.observacao) ? '—' : c.observacao}"></td>
                <td th:text="${c.paciente.nome}"></td>
                <td th:text="${c.medico.nome}"></td>
                <td th:if="${medicoLogado}">
                    <form th:action="@{/consultas/{id}/observacao(id=${c.id})}" method="post">
                        <textarea name="observacao" class="form-control form-control-sm mb-2"
                                  maxlength="255" rows="2" placeholder="Observação da consulta"
                                  th:text="${c.observacao}"></textarea>
                        <button type="submit" class="btn btn-sm btn-outline-primary">Salvar observação</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</main>
</body>
</html>
