<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Consultas</title>
</head>
<body>
<main class="container my-4">

    <h2 class="mb-4">Consultas realizadas</h2>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Data</th>
                <th>Valor</th>
                <th>Observação</th>
                <th>Paciente</th>
                <th>Médico</th>
                <th class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${consulta}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.data != null ? #temporals.format(c.data, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                <td th:text="${c.valor}"></td>
                <td th:text="${c.observacao}"></td>
                <td th:text="${c.paciente.nome}"></td>
                <td th:text="${c.medico.nome}"></td>
                <td class="text-end">Registrada após confirmação</td>
            </tr>
            </tbody>
        </table>
    </div>

</main>
</body>
</html>
