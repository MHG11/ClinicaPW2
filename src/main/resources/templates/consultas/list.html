<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Consultas</title>
</head>
<body>
<main class="container my-4">

    <div th:replace="~{fragments/components :: page-header('Consultas', @{/consultas/form}, 'Nova consulta')}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Data</th>
                <th>Valor</th>
                <th>Observação</th>
                <th>Paciente</th>
                <th>Médico</th>
                <th class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${consulta}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.data}"></td>
                <td th:text="${c.valor}"></td>
                <td th:text="${c.observacao}"></td>
                <td th:text="${c.paciente.nome}"></td>
                <td th:text="${c.medico.nome}"></td>
                <td th:replace="~{fragments/components :: row-actions(@{/consultas/edit/{id}(id=${c.id})}, @{/consultas/remove/{id}(id=${c.id})})}"></td>
            </tr>
            </tbody>
        </table>
    </div>

</main>
</body>
</html>
