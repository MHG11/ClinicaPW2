<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Horários disponíveis</title>
</head>
<body>
<main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h2 class="mb-0">Horários disponíveis</h2>
        <a sec:authorize="hasAnyRole('ADMIN','SECRETARIA','MEDICO')"
           th:href="@{/agenda/form}" class="btn btn-success">Disponibilizar horário</a>
    </div>
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div th:if="${#lists.isEmpty(horarios)}" class="alert alert-info">
        No momento não há horários disponíveis.
    </div>
    <div class="table-responsive" th:unless="${#lists.isEmpty(horarios)}">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Médico</th>
                <th>Data</th>
                <th>Horário</th>
                <th sec:authorize="hasAnyRole('ADMIN','SECRETARIA','PACIENTE')">Agendar</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="horario : ${horarios}">
                <td th:text="${horario.medico.nome}"></td>
                <td th:text="${#temporals.format(horario.dataHora, 'dd/MM/yyyy')}"></td>
                <td th:text="${#temporals.format(horario.dataHora, 'HH:mm')}"></td>
                <td sec:authorize="hasAnyRole('ADMIN','SECRETARIA','PACIENTE')">
                    <form th:action="@{/agendamentos/agendar/{id}(id=${horario.id})}" method="post"
                          class="d-flex flex-wrap gap-2">
                        <select sec:authorize="hasAnyRole('ADMIN','SECRETARIA')" name="pacienteId"
                                class="form-select form-select-sm w-auto" required>
                            <option value="">Selecione o paciente</option>
                            <option th:each="paciente : ${pacientes}" th:value="${paciente.id}"
                                    th:text="${paciente.nome}"></option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-primary">Agendar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
