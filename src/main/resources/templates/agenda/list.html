<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Agenda da clínica</title>
</head>
<body>
<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Agenda da clínica</h2>
        <a class="btn btn-success" th:href="@{/agenda/form}">Disponibilizar horário</a>
    </div>

    <div th:if="${mensagem}" class="alert alert-success" role="alert" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
    <div th:if="${#lists.isEmpty(horarios)}" class="alert alert-info">Nenhum horário cadastrado.</div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(horarios)}">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Médico</th>
                <th>Data</th>
                <th>Horário</th>
                <th>Situação</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="horario : ${horarios}">
                <td th:text="${horario.medico.nome}"></td>
                <td th:text="${#temporals.format(horario.data, 'dd/MM/yyyy')}"></td>
                <td th:text="${#temporals.format(horario.horario, 'HH:mm')}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${horario.status.name() == 'DISPONIVEL'} ? ' text-bg-success' : ' text-bg-secondary'"
                          th:text="${horario.status.name() == 'DISPONIVEL'} ? 'Disponível' : 'Agendado'"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
