<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h4 class="mb-3">Usuários</h4>

    <div class="card shadow-sm">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Login</th>
                <th>Perfis</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuario}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.login}"></td>
                <td>
                    <span th:each="p : ${u.perfis}" th:text="${p.nome}"
                          class="badge bg-secondary me-1"></span>
                </td>
                <td>
                    <span th:if="${u.ativo}" class="badge bg-success">Ativo</span>
                    <span th:unless="${u.ativo}" class="badge bg-danger">Inativo</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="4" class="text-center text-muted">Nenhum usuário cadastrado.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
