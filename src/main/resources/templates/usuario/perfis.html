<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Perfis de acesso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h4 class="mb-3">Perfis de acesso</h4>

    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

    <div class="card shadow-sm">
        <table class="table align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th>Login</th>
                <th>Perfil atual</th>
                <th style="width: 320px;">Alterar para</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuario}">
                <td th:text="${u.login}"></td>
                <td>
                    <span th:each="p : ${u.perfis}" th:text="${p.nome}"
                          class="badge bg-secondary me-1"></span>
                    <span th:if="${#lists.isEmpty(u.perfis)}" class="text-muted">sem perfil</span>
                </td>
                <td>
                    <form th:action="@{/usuario/{id}/perfil(id=${u.id})}" method="post"
                          class="d-flex gap-2">
                        <select name="perfilId" class="form-select form-select-sm" required>
                            <option th:each="p : ${perfis}" th:value="${p.id}" th:text="${p.nome}"></option>
                        </select>
                        <button type="submit" class="btn btn-primary btn-sm">Salvar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
