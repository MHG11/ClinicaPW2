<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solicitações de médicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Solicitações de cadastro médico</h1>
        <a th:href="@{/consultas/list}" class="btn btn-outline-secondary">Voltar</a>
    </div>
    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
    <div th:if="${#lists.isEmpty(solicitacoes)}" class="alert alert-info">
        Não há solicitações pendentes.
    </div>
    <div class="table-responsive" th:unless="${#lists.isEmpty(solicitacoes)}">
        <table class="table table-striped table-hover align-middle bg-white">
            <thead>
            <tr>
                <th>Nome</th>
                <th>CPF</th>
                <th>CRM</th>
                <th>Especialidade</th>
                <th>Login</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="solicitacao : ${solicitacoes}">
                <td th:text="${solicitacao.pessoa.nome}"></td>
                <td th:text="${solicitacao.pessoa.cpf}"></td>
                <td th:text="${solicitacao.pessoa.crm}"></td>
                <td th:text="${solicitacao.pessoa.especialidade}"></td>
                <td th:text="${solicitacao.login}"></td>
                <td>
                    <div class="d-flex gap-2">
                        <form th:action="@{/usuario/medicos-pendentes/{id}/aprovar(id=${solicitacao.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-success">Aprovar</button>
                        </form>
                        <form th:action="@{/usuario/medicos-pendentes/{id}/rejeitar(id=${solicitacao.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Rejeitar</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
