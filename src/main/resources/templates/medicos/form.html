<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Médico</title>
</head>
<body>
<main class="container my-4">

    <h2 class="mb-4" th:text="${medicos.id == null} ? 'Novo médico' : 'Editar médico'">Médico</h2>

    <form th:action="${medicos.id == null} ? @{/medicos/save} : @{/medicos/update}"
          th:object="${medicos}" method="post" class="col-lg-6">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="crm" class="form-label">CRM</label>
            <input type="text" id="crm" class="form-control" th:field="*{crm}" placeholder="CRM">
        </div>

        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" id="nome" class="form-control" th:field="*{nome}" placeholder="Nome">
        </div>

        <div th:replace="~{fragments/components :: form-actions(@{/medicos/list})}"></div>
    </form>

</main>
</body>
</html>
