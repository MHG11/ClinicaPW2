<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Médico</title>
</head>
<body>
<main class="container my-4">

    <h2 class="mb-4" th:text="${medicos.id == null} ? 'Novo médico' : 'Editar médico'">Médico</h2>

    <form th:action="@{/medicos/save}"
          th:object="${medicos}" method="post" class="col-lg-6">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="usuarioId" class="form-label">Usuário</label>
            <select id="usuarioId" name="usuarioId" class="form-select">
                <option value="">Sem usuário (só cadastro)</option>
                <option th:each="u : ${usuarios}"
                        th:value="${u.id}"
                        th:text="${u.login}">login</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="crm" class="form-label">CRM</label>
            <input type="text" id="crm" class="form-control" th:field="*{crm}" th:errorclass="is-invalid" placeholder="CRM">
        </div>

        <div class="mb-3">
            <label for="especialidade" class="form-label">Especialidade</label>
            <input type="text" id="especialidade" class="form-control" th:field="*{especialidade}"
                   placeholder="Especialidade">
        </div>

        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" id="nome" class="form-control" th:field="*{nome}" th:errorclass="is-invalid" placeholder="Nome">
        </div>

        <div class="mb-3">
            <label for="cpf" class="form-label">cpf</label>
            <input type="text" id="cpf" class="form-control" th:field="*{cpf}" th:errorclass="is-invalid" placeholder="cpf">
        </div>

        <ul th:if="${#fields.hasAnyErrors()}">
            <li th:each="erro : ${#fields.detailedErrors()}">
                <span th:text="${erro.message}"></span>
            </li>
        </ul>

        <div th:replace="~{fragments/components :: form-actions(@{/medicos/list})}"></div>
    </form>

</main>
</body>
</html>
