<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Médicos</title>
</head>
<body>
<main class="container my-4">

    <div th:replace="~{fragments/components :: page-header('Médicos', @{/medicos/form}, 'Novo médico')}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>CRM</th>
                <th>Nome</th>
                <th class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${medicos}">
                <td th:text="${m.id}"></td>
                <td th:text="${m.crm}"></td>
                <td th:text="${m.nome}"></td>
                <td th:replace="~{fragments/components :: row-actions(@{/medicos/edit/{id}(id=${m.id})}, @{/medicos/remove/{id}(id=${m.id})})}"></td>
            </tr>
            </tbody>
        </table>
    </div>

</main>
</body>
</html>
