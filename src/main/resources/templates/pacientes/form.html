<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Paciente</title>
</head>
<body>
<main class="container my-4">

    <h2 class="mb-4" th:text="${paciente.id == null} ? 'Novo paciente' : 'Editar paciente'">Paciente</h2>

    <form th:action="@{/pacientes/save}"
          th:object="${paciente}" method="post" class="col-lg-6">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="usuarioId" class="form-label">Usuário</label>
            <select id="usuarioId" name="usuarioId" class="form-select">
                <option value="">Sem usuário (só cadastro)</option>
                <option th:each="u : ${usuarios}"
                        th:value="${u.id}"
                        th:text="${u.login}">login</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" id="nome" class="form-control" th:field="*{nome}"
                   th:errorclass="is-invalid" placeholder="Nome">
        </div>
        <div class="mb-3">
            <label for="cpf" class="form-label">CPF</label>
            <input type="text" id="cpf" class="form-control" th:field="*{cpf}"
                   th:errorclass="is-invalid" placeholder="CPF">
        </div>
        <div class="mb-3">
            <label for="telefone" class="form-label">Telefone</label>
            <input type="text" id="telefone" class="form-control" th:field="*{telefone}"
                   th:errorclass="is-invalid" placeholder="Telefone">
        </div>
        <ul th:if="${#fields.hasAnyErrors()}">
            <li th:each="erro : ${#fields.detailedErrors()}">
                <span th:text="${erro.message}"></span>
            </li>
        </ul>


        <div th:replace="~{fragments/components :: form-actions(@{/pacientes/list})}"></div>
    </form>

</main>
</body>
</html>
